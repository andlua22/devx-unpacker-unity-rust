[package]
name = "il2cpp_dumper"
version = "8.5.0"
edition = "2024"
authors = ["Rodroidmods"]
license = "GPL-3.0-or-later"
description = "Vendored library core of il2cpp-dumper-rs integrated into DevX."
homepage = "https://github.com/rodroidmods/il2cpp-dumper-rs"
repository = "https://github.com/rodroidmods/il2cpp-dumper-rs"
keywords = ["il2cpp", "dumper", "android", "windows", "reverse-engineering"]
categories = ["development-tools", "parsing", "security"]
readme = "README.md"

[dependencies]
byteorder = "1"
dotnetdll = { version = "0.1.3", path = "dotnetdll-main" }
lz4_flex = "0.11"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yaxpeax-arm = "0.4"
yaxpeax-arch = "0.3"
iced-x86 = "1.21"
include_dir = "0.7.4"
string-interner = "0.20.0"
fixedbitset = "0.5.7"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Native pseudo-C# generation (recovery engine) is built-in; the vendored
# Ghidra decompiler has been removed as a dependency.
default = []

[dev-dependencies]
pretty_assertions = "1"
